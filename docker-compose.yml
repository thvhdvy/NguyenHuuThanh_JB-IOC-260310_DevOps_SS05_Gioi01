services:
  quickbite-user:
    image: quickbite-user-service:latest
    ports:
      - "${USER_SERVER_PORT}:${USER_SERVER_PORT}"
    container_name: quickbite-user
    environment:
      - PORT=${USER_SERVER_PORT}
      - DB_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${USER_DB_NAME}
      - DB_USER=${USER_DB_USERNAME}
      - DB_PASSWORD=${USER_DB_PASSWORD}
    restart: on-failure
    networks:
      - quickbite-net

  quickbite-restaurant:
    image: quickbite-restaurant-service:latest
    ports:
      - "${RESTAURANT_SERVER_PORT}:${RESTAURANT_SERVER_PORT}"
    container_name: quickbite-restaurant
    environment:
      - PORT=${RESTAURANT_SERVER_PORT}
      - DB_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${RESTAURANT_DB_NAME}
      - DB_USER=${RESTAURANT_DB_USERNAME}
      - DB_PASSWORD=${RESTAURANT_DB_PASSWORD}
    restart: on-failure
    networks:
      - quickbite-net

  quickbite-order:
    image: quickbite-order-service:latest
    ports:
      - "${ORDER_SERVER_PORT}:${ORDER_SERVER_PORT}"
    container_name: quickbite-order
    environment:
      - PORT=${ORDER_SERVER_PORT}
      - DB_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${ORDER_DB_NAME}
      - DB_USER=${ORDER_DB_USERNAME}
      - DB_PASSWORD=${ORDER_DB_PASSWORD}
      - USER_SERVICE_URL=http://quickbite-user:${USER_SERVER_PORT}
      - RESTAURANT_SERVICE_URL=http://quickbite-restaurant:${RESTAURANT_SERVER_PORT}
      - NOTIFICATION_SERVICE_URL=http://quickbite-notification:${NOTIFICATION_SERVER_PORT}
    restart: on-failure
    networks:
      - quickbite-net

  quickbite-notification:
    image: quickbite-notification-service:latest
    ports:
      - "${NOTIFICATION_SERVER_PORT}:${NOTIFICATION_SERVER_PORT}"
    container_name: quickbite-notification
    environment:
      - PORT=${NOTIFICATION_SERVER_PORT}
      - DB_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${NOTIFICATION_DB_NAME}
      - DB_USER=${NOTIFICATION_DB_USERNAME}
      - DB_PASSWORD=${NOTIFICATION_DB_PASSWORD}
    restart: on-failure
    networks:
      - quickbite-net

networks:
  quickbite-net:
    external: true
